name = "ontrack-pair-relay"
main = "src/worker.ts"
compatibility_date = "2026-08-17"

# Static pairing page (public/index.html). Requests that do not match an
# asset (e.g. /m/<id>) fall through to the Worker above.
[assets]
directory = "./public"

# Public pairing endpoint; Wrangler creates the DNS record in the markchu.work
# zone automatically on deploy.
routes = [{ pattern = "pair.markchu.work", custom_domain = true }]

# Create the namespace once with:
#   wrangler kv:namespace create MAILBOXES
# then replace the placeholder id below with the id it prints.
[[kv_namespaces]]
binding = "MAILBOXES"
id = "8d943a5c5797449faee8220095f69cfa"
